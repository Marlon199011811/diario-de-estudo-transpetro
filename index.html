  h+=rv?`<b>Como foi?</b><div class=gr>${[['Errei',1],['Difícil',2],['Bom',3],['Fácil',4]].map(([l,g])=>`<button onclick="gr(${i},${g})"><b>${l}</b><small>${dbt(t0,rate(s.c,g,t0).due)} d</small></button>`).join('')}</div>`:`<button class=pri onclick="rv=1;draw()">Tentei lembrar — avaliar</button>`}
 else h+=`<h2>Nenhuma revisão pendente 🎉</h2><small>Marque tópicos como “Estudado” para criar cartões.</small>`;
 h+=`</div><div class=card><h2>Próximas revisões</h2>${up.length?`<table>${up.slice(0,10).map(([i,s])=>`<tr><td>${br(s.c.due)}</td><td>${esc(T[i][1].slice(0,80))}</td></tr>`).join('')}</table>`:'<small>Vazio.</small>'}</div>
 <div class=card><h2>Como funciona</h2><small>Usa o <b>FSRS</b>, o algoritmo de repetição espaçada que substituiu o SM-2 no Anki (2023). Ele estima a estabilidade e a dificuldade de cada tópico e agenda a próxima revisão para quando a chance de lembrar cair para a retenção desejada (hoje ${Math.round(S.c.r*100)}%, ajustável em Ajustes). Parâmetros padrão do FSRS-5, sem otimização com o seu histórico.</small></div>`;return h};
function gr(i,g){S.t[i].c=rate(S.t[i].c,g,today());S.t[i].r=true;rv=0;save();draw()}
V.hor=()=>`<div class=card><h2>Registrar sessão</h2><div class=f><label>Data<input type=date id=ld value="${today()}"></label><label>Tópico ou disciplina${sel('d0','ls')}</label><label>Minutos<input type=number id=lm min=1 value=50 style="width:80px"></label><button class=pri onclick="addL()">Registrar</button></div></div>
 <div class=card><h2>Últimas sessões</h2>${S.l.length?`<table>${S.l.map((x,j)=>[x,j]).sort((a,b)=>b[0].d.localeCompare(a[0].d)).slice(0,25).map(([x,j])=>`<tr><td>${br(x.d)}</td><td>${D[x.c][0]}${x.t>=0?'<br><small>'+esc(T[x.t][1].slice(0,60))+'</small>':''}</td><td>${fm(x.m)}</td><td><button class=sec aria-label="Excluir" onclick="S.l.splice(${j},1);save();draw()">×</button></td></tr>`).join('')}</table>`:'<small>Nenhuma sessão ainda. O Pomodoro registra sozinho ao fim de cada foco.</small>'}</div>`;
function addL(){const m=+$('#lm').value;if(!(m>0))return;S.l.push(Object.assign({d:$('#ld').value||today(),m},pick($('#ls').value)));save();draw()}
const dur=()=>S.c[P.m],MN={f:'Foco',s:'Pausa curta',g:'Pausa longa'};
V.pom=()=>`<div class="card pm"><div class=chips style="justify-content:center">${['f','s','g'].map(m=>`<button class="chip ${P.m==m?'on':''}" onclick="P.m='${m}';P.run=0;P.left=dur()*60;draw()">${MN[m]}</button>`).join('')}</div>
 <svg viewBox="0 0 220 220" width=240 role=timer aria-label="Cronômetro"><circle cx=110 cy=110 r=96 fill=none stroke="var(--ln)" stroke-width=10 /><circle id=pr cx=110 cy=110 r=96 fill=none stroke="${P.m=='f'?'var(--a)':'var(--w)'}" stroke-width=10 stroke-linecap=round transform="rotate(-90 110 110)" stroke-dasharray=603.2 /><text id=pt class=t x=110 y=125 text-anchor=middle></text></svg>
 <p><small>${MN[P.m]} · ciclo ${P.cy%S.c.n+1} de ${S.c.n} · hoje: ${fm(sum(x=>x.d==today()))}</small></p>
 <p>${P.m=='f'?`Estudando: ${sel(P.sel)}`:''}</p>
 <p><button class=pri onclick="pt_()">${P.run?'Pausar':'Iniciar'}</button> <button class=sec onclick="P.run=0;P.left=dur()*60;draw()">Reiniciar</button> <button class=sec onclick="skip()">Pular</button></p>
 <small>Ao concluir um foco, os minutos são registrados no tópico escolhido. “Pular” não registra.</small></div>`;
function pt_(){if(P.run){P.left=Math.max(0,Math.round((P.end-Date.now())/1000));P.run=0}else{P.end=Date.now()+P.left*1000;P.run=1}draw()}
function nxt(){P.m=P.m=='f'?(P.cy%S.c.n?'s':'g'):'f';P.left=dur()*60;P.run=0}
function skip(){if(P.m=='f')P.cy++;nxt();draw()}
function fin(){if(P.m=='f'){S.l.push(Object.assign({d:today(),m:S.c.f},pick(P.sel)));save();P.cy++}nxt();beep();draw()}
function beep(){try{const c=new AudioContext(),o=c.createOscillator(),g=c.createGain();o.connect(g);g.connect(c.destination);o.frequency.value=880;g.gain.setValueAtTime(.2,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+1.2);o.start();o.stop(c.currentTime+1.2)}catch(e){}}
function dp(){const e=$('#pt');if(!e)return;const m=String(Math.floor(P.left/60)).padStart(2,'0')+':'+String(P.left%60).padStart(2,'0');e.textContent=m;$('#pr').style.strokeDashoffset=603.2*(1-P.left/(dur()*60));document.title=P.run?m+' · '+MN[P.m]:BASE}
setInterval(()=>{if(!P.run)return;P.left=Math.max(0,Math.round((P.end-Date.now())/1000));if(P.left<=0)fin();else dp()},250);
const cfg=(k,v)=>{S.c[k]=v;save();if(!P.run&&'fsg'.includes(k))P.left=dur()*60};
V.cfg=()=>`<div class=card><h2>Ajustes</h2><div class=f>
 ${[['f','Foco (min)'],['s','Pausa curta'],['g','Pausa longa'],['n','Focos até a pausa longa'],['w','Meta semanal (h)']].map(([k,l])=>`<label>${l}<input type=number min=1 value=${S.c[k]} style="width:100px" onchange="cfg('${k}',+this.value)"></label>`).join('')}
 <label>Retenção desejada<select onchange="cfg('r',+this.value)">${[.8,.85,.9,.95].map(r=>`<option value=${r} ${S.c.r==r?'selected':''}>${r*100}%</option>`).join('')}</select></label>
 <label>Data da prova<input type=date value="${S.c.x}" onchange="cfg('x',this.value)"></label></div></div>
 <div class=card><h2>Conta e sincronização (Firebase)</h2>${fa?(fu?`<p>Conectado como ${esc(fu.email||fu.uid)}. Sincronizando automaticamente.</p><button class=sec onclick="fa.signOut()">Sair</button>`:`<p>Entre para sincronizar entre aparelhos.</p><button class=pri onclick="fa.signInWithPopup(new firebase.auth.GoogleAuthProvider()).catch(e=>alert(e.message))">Entrar com Google</button>`):'<small>Firebase não configurado: preencha FB_CONFIG no início do script.</small>'}</div>
 <div class=card><h2>Backup</h2><small>Os dados ficam só neste navegador. Gere o backup, copie o texto e guarde; para restaurar, cole-o e clique em Restaurar.</small>
 <p><textarea id=bk rows=5 style="width:100%"></textarea></p><button class=sec onclick="$('#bk').value=JSON.stringify(S)">Gerar backup</button> <button class=sec onclick="rst()">Restaurar</button> <button class=sec style="border-color:var(--r);color:var(--r)" onclick="if(confirm('Apagar todos os dados?')){S={c:S.c};nz();save();draw()}">Apagar tudo</button></div>`;
function rst(){try{const o=JSON.parse($('#bk').value);if(!o.t||!o.l)throw 0;S=o;nz();save();draw()}catch(e){alert('Backup inválido.')}}
const W0='2026-09-21',WK=[["Diagnóstico com 1 prova anterior. Desenho técnico, metrologia, SI e conversão de unidades.","Mat: conjuntos, razão e proporção, regra de três, porcentagem. Port: interpretação de texto e classes de palavras.","Diagnóstico",18],["Medição de temperatura e escalas, instrumentos de medição e aferição, mecânica geral.","Mat: equações de 1º e 2º grau e sistemas. Port: concordância.","",18],["Mecânica dos fluidos, resistência dos materiais (inclui dilatação térmica). Química: funções químicas e estequiometria.","Mat: funções. Port: crase e pontuação.","",18],["Calorimetria, transferência de calor e mudanças de estado.","Mat: trigonometria e geometria plana. Port: coesão e significação das palavras.","",18],["Materiais I: seleção de materiais, aços e ferros fundidos, diagrama ferro-carbono, não ferrosos.","Mat: combinatória e probabilidade. Port: ortografia e textos.","",18],["Materiais II: tratamentos térmicos, alto-forno/aciaria/conversores, fundição e conformação. Usinagem.","Mat: estatística. Port: textos.","40 questões de materiais",18],["Soldagem (eletrodo revestido e TIG) e ensaios destrutivos e não destrutivos, com muita prática de questões.","Mat: juros simples e compostos. Port: textos.","",18],["Eletroquímica, oxirredução, hidrocarbonetos e polímeros. Eletricidade básica. Ondas mecânicas e eletromagnéticas.","Mat: geometria espacial. Port: revisão.","Simulado 1 (sábado)",18],["2ª passada em materiais, metalurgia, soldagem e ensaios (os blocos mais pesados).","Prova isolada de gerais (20 questões).","Simulado 2 (sábado)",18],["2ª passada em desenho, metrologia, mecânica, resistência dos materiais, térmica e química.","Revisão dos pontos fracos de Mat e Port.","Simulado 3 (sábado)",18],["Revisão do caderno de erros e das fórmulas; 30 a 40 questões leves por dia; sábado de descanso.","Só revisão leve.","Semana da prova",15]],SM=[['Diagnóstico','2026-09-21'],['Simulado 1','2026-11-14'],['Simulado 2','2026-11-21'],['Simulado 3','2026-11-28'],['Extra',''],['Extra','']];
const cw=()=>Math.min(11,Math.max(0,Math.floor(dbt(W0,today())/7)+1)),RD=[1,1,1,0,0];
const sv=s=>{const{e,p,m}=s;if([e,p,m].some(v=>v===undefined||v===''||v===null))return null;const pe=e/40,pg=(p+m)/20;return{pe,pg,t:e+p+m,ok:pe>=.5&&pg>=.5&&p>0&&m>0}};
const rc=s=>{const r=sv(s);return r?`${Math.round(r.pe*100)}% esp. · ${Math.round(r.pg*100)}% ger. · ${r.t}/60<br><small style="color:var(--${r.ok?'a':'r'})">${r.ok?'Dentro dos mínimos':'Abaixo do mínimo'}${r.pe>=.8&&r.pg>=.6?' · meta atingida':''}</small>`:'<small>—</small>'};
const simCard=()=>{let j=-1;SM.forEach((m,i)=>{if(sv(S.s[i]||{}))j=i});return`<div class=card><h2>Último simulado</h2>${j<0?'<small>Nenhum registrado. Faça o diagnóstico na aba Simulados.</small>':`<b>${SM[j][0]}</b>: ${rc(S.s[j])}<br><small>Metas: 80% nas específicas e 60% nas gerais.</small>`}</div>`};
V.sim=()=>`<div class=card><h2>Simulados</h2><small>Prova real: 40 específicas + 10 Português + 10 Matemática, em 4 horas. Mínimos do edital: 50% nas específicas, 50% nas gerais e nota acima de zero em Português e Matemática.</small></div><div class=card><table><tr><th>Simulado</th><th>Espec. /40</th><th>Port. /10</th><th>Mat. /10</th><th>Resultado</th></tr>${SM.map((m,j)=>{const s=S.s[j]||{};return`<tr><td>${m[0]}<br><small>${m[1]?br(m[1]):'—'}</small></td>${['e','p','m'].map(k=>`<td><input type=number min=0 class=n value="${s[k]??''}" onchange="sm(${j},'${k}',this.value)"></td>`).join('')}<td id=r${j}>${rc(s)}</td></tr>`}).join('')}</table></div>`;
function sm(j,k,v){S.s[j]=S.s[j]||{};S.s[j][k]=v===''?'':+v;save();$('#r'+j).innerHTML=rc(S.s[j])}
function wk(n,k,v){S.w[n]=S.w[n]||{};S.w[n][k]=v;save()}
V.pl=()=>{const c=cw();return`<div class=card><h2>Cronograma: 11 semanas até 06/12/2026</h2><small>Semana atual: ${c||'ainda não começou'}. As horas realizadas vêm do Pomodoro e da aba Horas.</small></div>`+WK.map((w,j)=>{const a=add(W0,j*7),b=add(a,6),h=sum(x=>x.d>=a&&x.d<=b),s=S.w[j+1]||{};return`<div class=card ${c==j+1?'style="border:2px solid var(--a)"':''}><h2>Semana ${j+1} · ${br(a)} a ${br(b)}${w[2]?' · '+w[2]:''}</h2><p><b>Específicas:</b> ${w[0]}</p><p><b>Gerais:</b> ${w[1]}</p><div class=f><small>Horas: ${fm(h)} de ${w[3]}h</small><label>Questões<input type=number min=0 class=n value="${s.q||''}" onchange="wk(${j+1},'q',+this.value)"></label><label>Acertos<input type=number min=0 class=n value="${s.a||''}" onchange="wk(${j+1},'a',+this.value)"></label><small>Meta: ${S.c.m} questões</small></div></div>`}).join('')+`<div class=card><h2>Concorrência (ampla concorrência)</h2><table><tr><th>Polo</th><th>Imediatas</th><th>Vagas + reserva</th><th>Avançam (2×)</th></tr><tr><td>Norte e Nordeste</td><td>0</td><td>5</td><td>10</td></tr><tr><td>Rio de Janeiro</td><td>1</td><td>9</td><td>18</td></tr><tr><td>São Paulo</td><td>1</td><td>6</td><td>12</td></tr></table><small>Só avançam para a Fase 2 os mais bem classificados na nota de Específicas.</small></div><div class=card><h2>Requisitos para a admissão</h2>${['Curso técnico concluído (Eletrotécnica ou Eletromecânica)','Registro de Técnico no conselho, anuidade em dia','CNH categoria B, C, D ou E','Quitação eleitoral','Quitação militar (se homem)'].map((t,i)=>`<p><label><input type=checkbox ${(S.rq[i]??RD[i])?'checked':''} onchange="S.rq[${i}]=this.checked;save()"> ${t}</label></p>`).join('')}</div>`};
function draw(){$('#nv').innerHTML=TABS.map(([k,l])=>`<button class="${tab==k?'on':''}" onclick="tab='${k}';rv=0;draw()">${l}</button>`).join('');$('#app').innerHTML=V[tab]();dp()}
draw();
</script></body></html>
